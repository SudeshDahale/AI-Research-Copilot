apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arclight-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: arclight-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arclight-frontend
                port:
                  number: 8080
