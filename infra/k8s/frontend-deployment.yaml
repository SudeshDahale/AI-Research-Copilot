apiVersion: apps/v1
kind: Deployment
metadata:
  name: arclight-frontend
  namespace: default
  labels:
    app: arclight-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arclight-frontend
  template:
    metadata:
      labels:
        app: arclight-frontend
    spec:
      containers:
        - name: frontend
          image: arclight-frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: VITE_API_URL
              value: "http://arclight-backend:8000/api/v1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: arclight-frontend
  namespace: default
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: arclight-frontend
