[project]
name = "arclight-backend"
version = "0.1.0"
description = "Arclight backend -- FastAPI + PostgreSQL/pgvector + Redis/Celery + LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "alembic>=1.14.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    "pgvector>=0.3.6",
    "voyageai>=0.3.2",
    "numpy>=1.26.0",
    "groq>=0.11.0",
    "langgraph>=0.2.60",
    "sse-starlette>=2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]